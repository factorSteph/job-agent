name: job-agent

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
    # NUEVO (Nov 2026) — casilla en el botón "Run workflow". Marcada: NO corre
    # el agente; provoca una falla a propósito para probar que el correo de
    # falla sale, y ese correo va SOLO a Steph (no le llega a Esteban).
    inputs:
      probar_aviso:
        description: "Solo probar el correo de falla (va solo a Steph)"
        type: boolean
        default: false

# NUEVO (Oct 2026) — permiso para que la corrida suba vistos_<PERFIL>.json
# al repo. Efecto secundario a favor: ese commit diario cuenta como
# actividad, así GitHub ya no desactiva el workflow por 60 días quieto.
permissions:
  contents: write

jobs:
  correr-agente:
    runs-on: ubuntu-latest
    strategy:
      # NUEVO (Sesión 11) — un motor, dos moldes. Este job corre dos veces,
      # una por perfil, cada una con su propio PERFIL como variable de
      # entorno. Mismo checkout, mismo requirements.txt, mismo script.
      fail-fast: false
      # Octubre 2026 — solo corre ESTEBAN. Para volver a prender a Steph,
      # agregar STEPH a la lista: [STEPH, ESTEBAN].
      matrix:
        perfil: [ESTEBAN]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Falla de prueba (solo con probar_aviso)
        if: ${{ inputs.probar_aviso }}
        run: |
          echo "Modo prueba: falla a propósito para disparar el correo de falla."
          exit 1

      - if: ${{ !inputs.probar_aviso }}
        run: python buscar_empleos.py
        env:
          PERFIL: ${{ matrix.perfil }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ESTEBAN_EMAIL: ${{ secrets.ESTEBAN_EMAIL }}

      # NUEVO (Oct 2026) — guardar la memoria de puestos vistos. Solo corre
      # si el script terminó bien. El pull --rebase es por si otra corrida
      # (otro perfil) subió su propio archivo un momento antes.
      - name: Guardar memoria de vistos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vistos_${{ matrix.perfil }}.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la memoria."
          else
            git commit -m "Memoria de vistos (${{ matrix.perfil }})"
            git pull --rebase
            git push
          fi

      # NUEVO (Nov 2026) — lección del proyecto de Matt: una falla le llega a
      # la persona, no se queda en el log. Solo corre si algún paso de arriba
      # falló; le manda a Esteban (copia a Steph) el link a esta corrida.
      - name: Avisar por correo que la corrida falló
        if: failure()
        run: python avisar_falla.py
        env:
          PERFIL: ${{ matrix.perfil }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ESTEBAN_EMAIL: ${{ secrets.ESTEBAN_EMAIL }}
          PRUEBA: ${{ inputs.probar_aviso && '1' || '' }}