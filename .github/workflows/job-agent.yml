name: job-agent

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

jobs:
  correr-agente:
    runs-on: ubuntu-latest
    strategy:
      # NUEVO (Sesión 11) — un motor, dos moldes. Este job corre dos veces,
      # una por perfil, cada una con su propio PERFIL como variable de
      # entorno. Mismo checkout, mismo requirements.txt, mismo script.
      matrix:
        perfil: [STEPH, ESTEBAN]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python buscar_empleos.py
        env:
          PERFIL: ${{ matrix.perfil }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ESTEBAN_EMAIL: ${{ secrets.ESTEBAN_EMAIL }}